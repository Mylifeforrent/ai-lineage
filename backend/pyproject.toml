[project]
name = "clew"
version = "0.1.0"
description = "Clew — 字段级 AI 数据血缘工具（M1：数据底座）"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pyjwt>=2.8",
    "jsonpath-ng>=1.6",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
